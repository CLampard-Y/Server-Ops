# ===========================================================
#  Komari — 服务器监控面板
#  文档: https://github.com/komari-monitor/komari
#  部署目标: /home/Basic-Ops/komari/
# ===========================================================

services:
  komari:
    image: ghcr.io/komari-monitor/komari:latest
    container_name: komari
    restart: unless-stopped
    ports:
      - "3399:25774"  # 容器内部监听 25774，映射到主机 3399
    volumes:
      - ./data:/opt/komari/data
    environment:
      - TZ=Asia/Shanghai
