# ===========================================================
#  3x-ui — Xray 代理面板
#  文档: https://github.com/MHSanaei/3x-ui
#  部署目标: /home/App-Ops/3x-ui/
#
#  说明:
#  - 使用 host 网络，便于面板统一管理多协议/多端口监听
#  - 数据与证书落到 /home/App-Data/3x-ui/，避免被 Layer 3 同步覆盖
# ===========================================================

services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3x-ui
    restart: unless-stopped
    network_mode: host
    tty: true
    environment:
      - TZ=Asia/Shanghai
      - XRAY_VMESS_AEAD_FORCED=false
      - XUI_ENABLE_FAIL2BAN=true
    volumes:
      - /home/App-Data/3x-ui/db:/etc/x-ui/
      - /home/App-Data/3x-ui/cert:/root/cert/
