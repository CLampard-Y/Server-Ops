# ===========================================================
#  Alist — 文件列表/网盘聚合
#  文档: https://alist.nn.ci/
#  部署目标: /home/App-Ops/alist/
# ===========================================================

services:
  alist:
    image: xhofe/alist:latest
    container_name: alist
    restart: unless-stopped
    ports:
      - "5244:5244"
    volumes:
      - ./data:/opt/alist/data
    environment:
      - TZ=Asia/Shanghai
      - PUID=0
      - PGID=0
