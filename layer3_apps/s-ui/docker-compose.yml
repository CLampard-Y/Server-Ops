# ===========================================================
#  S-UI — Xray 面板
#  文档: https://github.com/alireza0/s-ui
#  部署目标: /home/App-Ops/s-ui/
# ===========================================================

services:
  s-ui:
    image: ghcr.io/alireza0/s-ui:latest
    container_name: s-ui
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/App-Data/s-ui/db:/app/db
      - /home/App-Data/s-ui/cert:/app/cert
    environment:
      - TZ=Asia/Shanghai
